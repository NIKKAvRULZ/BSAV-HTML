            ${docs.map(d => `
              <a href="${d.path}" download="${d.filename}" target="_blank" class="p-7 bg-slate-50/70 rounded-[2rem] border border-slate-200/70 hover:bg-white hover:border-cyan-300 hover:-translate-y-1 transition-all flex items-center justify-between group shadow-sm">

    const renderTeam = () => `

              <div class="bg-white rounded-[2rem] p-4 flex flex-col justify-between relative group ${m.isLeader ? 'border-2 border-[#22c55e] shadow-[0_10px_30px_-5px_rgba(34,197,94,0.12)]' : 'border border-slate-200/90 shadow-[0_4px_25px_-5px_rgba(0,0,0,0.05)]'}">

                  <div class="min-w-0 pr-2"><h4 class="text-base font-extrabold text-slate-900 leading-snug truncate">${m.name}</h4></div>${m.linkedin ? `<a href="${m.linkedin}" target="_blank" class="text-slate-300 hover:text-[#0077b5] transition-colors p-1 shrink-0"><i data-lucide="linkedin" class="w-4 h-4"></i></a>` : ''}

    const renderReferences = () => `
      <section id="references" class="py-32 bg-slate-50/50 border-t border-slate-200/60 relative overflow-hidden">
        <div class="container mx-auto px-6 max-w-7xl relative z-10 motion-hidden">
          <div class="text-center mb-20 max-w-3xl mx-auto">
            <span class="text-xs font-bold text-cyan-700 uppercase tracking-widest px-4 py-1.5 bg-cyan-50 rounded-full border border-cyan-100 inline-block mb-3.5 shadow-sm">Academic Citations</span>
            <h2 class="text-3xl md:text-5xl font-black text-slate-900 mb-4 tracking-tight">References & Prior Literature</h2>
            <p class="text-slate-500 font-normal text-base md:text-lg">Peer-reviewed papers, cryptographic standards, and institutional frameworks referenced in this work.</p>
            <div class="mx-auto h-1 w-12 bg-cyan-500/80 rounded-full mt-4"></div>
          </div>
          <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-5 max-w-6xl mx-auto">
            ${refs.map((r, i) => {
              const parts = r.split(/\((\d{4})\)/);
              const author = parts[0]?.trim();
              const year = parts[1];
              const details = parts[2]?.trim();
              return `
                <div class="p-7 bg-white/80 backdrop-blur-xl rounded-[2rem] border border-slate-200/70 hover:border-cyan-300 hover:-translate-y-1 transition-all flex flex-col justify-between group shadow-sm">
                  <div>
                    <div class="flex items-center justify-between mb-4">
                      <span class="font-mono text-xs font-bold px-2.5 py-1 rounded-lg bg-cyan-50 border border-cyan-100 text-cyan-700">[${i + 1}]</span>
                      <i data-lucide="book-open" class="w-4 h-4 text-slate-300 group-hover:text-cyan-600 transition-colors"></i>
                    </div>
                    <p class="text-sm font-medium text-slate-800 leading-relaxed group-hover:text-slate-900">${details ? details.replace(/^\./, '').trim() : r}</p>
                  </div>
                  <div class="pt-4 mt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400 font-medium">
                    <span class="truncate">${author}${year ? `(${year})` : ''}</span>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      </section>
    `;

    const renderFooter = () => `
      <footer id="contact" class="bg-[#020617] text-white pt-32 pb-16 px-6 relative overflow-hidden">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[1000px] h-[500px] bg-gradient-to-b from-cyan-500/10 via-indigo-500/5 to-transparent rounded-full blur-[140px] pointer-events-none"></div>
        <div class="container mx-auto max-w-5xl relative z-10 text-center">
          <div class="text-xs font-mono font-bold tracking-[0.25em] text-slate-400 uppercase mb-4 motion-hidden">PROJECT ID: ${PROJECT_ID}</div>
          <h2 class="text-5xl sm:text-6xl md:text-7xl font-black tracking-tight text-white mb-6 motion-hidden">Get In <span class="text-cyan-400">Touch.</span></h2>
          <p class="text-slate-400 text-sm md:text-base max-w-2xl mx-auto font-normal leading-relaxed mb-16 motion-hidden">For academic inquiries regarding the BSAV framework, decentralized grading architecture, or research collaboration.</p>
          <div class="p-8 md:p-12 bg-slate-900/60 backdrop-blur-2xl rounded-[2.5rem] border border-slate-800 max-w-3xl mx-auto mb-20 text-left shadow-[0_25px_50px_-15px_rgba(0,0,0,0.5)] motion-hidden">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-6 pb-8 border-b border-slate-800/80">
              <div>
                <div class="flex items-center gap-2 text-cyan-400 text-xs font-mono font-bold uppercase tracking-wider mb-2"><i data-lucide="building-2" class="w-4 h-4"></i> Academic Affiliation</div>
                <h3 class="text-2xl font-bold text-white mb-1">Sri Lanka Institute of Information Technology</h3>
                <p class="text-sm text-slate-400">Faculty of Computing · Department of Software Engineering</p>
              </div>
              <div class="shrink-0 flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-cyan-950/60 border border-cyan-800/60 text-cyan-300 text-xs font-mono font-bold">
                <i data-lucide="shield-check" class="w-3.5 h-3.5 text-cyan-400"></i> Malabe, Sri Lanka
              </div>
            </div>
            <div class="pt-8 grid sm:grid-cols-2 gap-6">
              ${supervisors.map(s => `
                <div class="p-4 bg-slate-950/50 rounded-2xl border border-slate-800/70">
                  <div class="text-[11px] font-mono text-cyan-400 uppercase tracking-wider font-bold mb-1">${s.role}</div>
                  <div class="text-sm font-bold text-white mb-0.5">${s.name}</div>
                </div>
              `).join('')}
            </div>
          </div>
          <div class="pt-8 border-t border-slate-800/80 flex flex-col md:flex-row justify-between items-center gap-6 text-xs text-slate-400">
            <div class="flex flex-wrap items-center justify-center gap-6 font-medium">
              <a href="#home" class="hover:text-cyan-400 transition-colors">Home</a>
              <a href="#infographic" class="hover:text-cyan-400 transition-colors">System Pipeline</a>
              <a href="#gap" class="hover:text-cyan-400 transition-colors">Problem Domain</a>
              <a href="#methodology" class="hover:text-cyan-400 transition-colors">Architecture</a>
              <a href="#merkle-zkp" class="hover:text-cyan-400 transition-colors">Visualizer</a>
              <a href="#references" class="hover:text-cyan-400 transition-colors">Citations</a>
            </div>
            <a href="${REPO}" target="_blank" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-900 border border-slate-800 hover:border-cyan-500/50 text-white font-bold transition-all hover:scale-105">
              <i data-lucide="github" class="w-4 h-4 text-cyan-400"></i><span>GitHub Repository</span>
            </a>
          </div>
          <div class="mt-8 text-[11px] font-mono text-slate-600">
            © 2026 ${PROJECT_ID} Research Group · SLIIT Faculty of Computing · All Rights Reserved.
          </div>
        </div>
      </footer>
    `;

    /* ───────── CORE APP RENDERER ───────── */
    const renderApp = () => {
      const root = document.getElementById('root');
      root.innerHTML = `
        ${renderNavbar()}
        <main class="flex-grow">
          ${renderHero()}
          ${renderInfographic()}
          ${renderLiteratureSurvey()}
          ${renderResearchGap()}
          ${renderProblemSolution()}
          ${renderObjectives()}
          ${renderMethodology()}
          ${renderMerkleZkp()}
          ${renderTechStack()}
          ${renderGitBranches()}
          ${renderMilestones()}
          ${renderDownloads()}
          ${renderTeam()}
          ${renderReferences()}
        </main>
        ${renderFooter()}
      `;

      if (window.lucide) lucide.createIcons();

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.remove('motion-hidden');
            entry.target.classList.add('motion-visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });

      document.querySelectorAll('.motion-hidden').forEach(el => observer.observe(el));
    };

    window.updateState = (key, value) => {
      state[key] = value;
      renderApp();
    };

    // Scroll listener for Navbar style & Milestones bounded progress bar
    window.addEventListener('scroll', () => {
      const isScrolled = window.scrollY > 20;
      if (state.scrolled !== isScrolled) {
        state.scrolled = isScrolled;
        renderApp();
      }

      // Milestones section progress calculation bounded precisely to the track
      const milestonesSec = document.getElementById('milestones');
      const progressBar = document.getElementById('milestone-progress-bar');
      const track = document.getElementById('milestones-track');
      if (milestonesSec && progressBar && track) {
        const trackRect = track.getBoundingClientRect();
        const winH = window.innerHeight;
        const trackH = track.offsetHeight;
        
        // Calculate how much of the track has scrolled past the middle/top of the screen
        const scrolledPx = winH / 2 - trackRect.top;
        let progress = (scrolledPx / trackH) * 100;
        progress = Math.max(0, Math.min(100, progress)); // Strictly clamped between 0% and 100%
        progressBar.style.height = `${progress}%`;
      }
    });

    document.addEventListener('DOMContentLoaded', renderApp);
  </script>
</body>
</html>
